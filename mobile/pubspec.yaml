name: noisenet_mobile
description: OpenNoiseNet mobile application for environmental noise monitoring with on-device AI processing.
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.1.0 <4.0.0"
  flutter: ">=3.13.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Dependency Injection
  get_it: ^8.2.0

  # Network & API
  dio: ^5.9.0
  json_annotation: ^4.9.0

  # Database & Storage
  shared_preferences: ^2.5.3
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # Audio Processing & Permissions
  permission_handler: ^12.0.1
  noise_meter: ^5.1.0
  audio_waveforms: ^1.3.0
  flutter_sound: ^9.28.0
  just_audio: ^0.10.5

  # Location & Maps
  geolocator: ^14.0.2

  # UI & Navigation
  go_router: ^16.2.1
  fl_chart: ^1.1.0

  # Utilities
  path: ^1.9.1
  uuid: ^4.5.1

  # Background Tasks & AI/ML
  workmanager: ^0.9.0+3
  tflite_flutter: ^0.11.0

  # AI Processing with Cactus framework
  cactus: ^0.2.4

  # Logging
  talker_flutter: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  json_serializable: ^6.11.1
  build_runner: ^2.8.0

  # Code Quality
  flutter_lints: ^6.0.0

  # App Icon Generation
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/noisenet-icon.png
    - assets/models/

# Flutter Launcher Icons Configuration
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/noisenet-icon.png"
  min_sdk_android: 26 # Required by tflite_flutter package
  web:
    generate: true
    image_path: "assets/noisenet-icon.png"
    background_color: "#hexcode"
    theme_color: "#hexcode"
  windows:
    generate: true
    image_path: "assets/noisenet-icon.png"
    icon_size: 48 # min:48, max:256, default: 48
  macos:
    generate: true
    image_path: "assets/noisenet-icon.png"
